<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games Hub</title>
<style>
:root {
  --bg: #101116;
  --panel: #191a22;
  --card: #20222d;
  --accent: #8b5cf6;
  --text: #f5f5fa;
  --muted: #a3a5b5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
header {
  background: #171820;
  padding: 17px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 5;
}
.logo { font-size: 25px; font-weight: 900; }
.logo span { color: var(--accent); }
input, button {
  font: inherit;
  border: 0;
  border-radius: 10px;
  padding: 12px;
}
input {
  background: #292b37;
  color: white;
  flex: 1;
  min-width: 150px;
}
button {
  cursor: pointer;
  background: var(--card);
  color: white;
}
button:hover { background: var(--accent); }
nav {
  display: flex;
  gap: 8px;
  padding: 15px 5%;
  overflow-x: auto;
}
nav button { white-space: nowrap; }
nav button.active { background: var(--accent); }
main { padding: 10px 5% 40px; }
h1 { font-size: clamp(25px, 5vw, 38px); }
.subtitle { color: var(--muted); }
.games {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 16px;
}
.game {
  background: var(--panel);
  border-radius: 15px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .2s;
  border: 1px solid #292b35;
}
.game:hover { transform: translateY(-4px); }
.cover {
  height: 115px;
  display: grid;
  place-items: center;
  font-size: 52px;
  background: linear-gradient(135deg, #292444, #252b40);
}
.info { padding: 12px; }
.info strong { display: block; margin-bottom: 6px; }
.info small { color: var(--muted); }
.star { float: right; color: #facc15; }
#player {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #090a0f;
  padding: 10px;
}
.playerbar {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
#gameFrame {
  width: 100%;
  height: calc(100% - 55px);
  border: 0;
  border-radius: 10px;
  background: white;
}
.empty { color: var(--muted); padding: 30px 0; }
footer { text-align: center; color: var(--muted); padding: 25px; }
</style>
</head>
<body>

<header>
  <div class="logo">🎮 Games<span>Hub</span></div>
  <input id="search" placeholder="Search games..." aria-label="Search games">
  <button id="favoritesButton">⭐ Favorites</button>
</header>

<nav id="categories">
  <button class="active" data-category="All">🔥 All Games</button>
  <button data-category="3D">🌐 3D</button>
  <button data-category="Racing">🏎️ Racing</button>
  <button data-category="Arcade">🕹️ Arcade</button>
  <button data-category="Puzzle">🧩 Puzzle</button>
  <button data-category="Sports">⚽ Sports</button>
  <button data-category="Other">🎯 Other</button>
</nav>

<main>
  <h1>Play Something Awesome</h1>
  <p class="subtitle">Free browser games. No downloads required when games support browser play.</p>
  <div id="games" class="games"></div>
  <p id="empty" class="empty" hidden>No games found. Check the search or add game files.</p>
</main>

<div id="player">
  <div class="playerbar">
    <strong id="gameTitle">Game</strong>
    <div>
      <button id="fullscreen">⛶ Fullscreen</button>
      <button id="close">✕ Close</button>
    </div>
  </div>
  <iframe id="gameFrame" title="Game player"
    allow="fullscreen; autoplay; gamepad"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>

<footer>Games Hub • Built for browser gaming</footer>

<script>
const games = [
  {name:"2048", icon:"🔢", category:"Puzzle", path:"games/puzzle/2048/index.html"},
  {name:"Car Race", icon:"🏎️", category:"Racing", path:"games/racing/car-race/index.html"},{name:"Drift Racing", icon:"🚗", category:"Racing", path:"games/racing/drift/index.html"},
  {name:"Minecraft Style", icon:"🧱", category:"3D", path:"games/3d/block-world/index.html"},
  {name:"3D Runner", icon:"🏃", category:"3D", path:"games/3d/runner/index.html"},
  {name:"Space Shooter", icon:"🚀", category:"Arcade", path:"games/arcade/space-shooter/index.html"},
  {name:"Snake", icon:"🐍", category:"Arcade", path:"games/arcade/snake/index.html"},
  {name:"Football", icon:"⚽", category:"Sports", path:"games/sports/football/index.html"}
];

let selectedCategory = "All";
let favoritesOnly = false;
let favorites = JSON.parse(localStorage.getItem("gamesHubFavorites") || "[]");

const gameGrid = document.getElementById("games");
const search = document.getElementById("search");

function renderGames() {
  const query = search.value.toLowerCase().trim();
  const filtered = games.filter(game =>
    (selectedCategory === "All" || game.category === selectedCategory) &&
    (!favoritesOnly || favorites.includes(game.name)) &&
    game.name.toLowerCase().includes(query)
  );

  gameGrid.innerHTML = "";
  document.getElementById("empty").hidden = filtered.length !== 0;

  filtered.forEach(game => {
    const card = document.createElement("article");
    card.className = "game";
    card.innerHTML = 
      <div class="cover">${game.icon}</div>
      <div class="info">
        <span class="star">${favorites.includes(game.name) ? "★" : "☆"}</span>
        <strong></strong>
        <small></small>
      </div>;
    card.querySelector("strong").textContent = game.name;
    card.querySelector("small").textContent = game.category;
    card.querySelector(".star").addEventListener("click", event => {
      event.stopPropagation();
      toggleFavorite(game.name);
    });
    card.addEventListener("click", () => openGame(game));
    gameGrid.appendChild(card);
  });
}

function toggleFavorite(name) {
  favorites = favorites.includes(name)
    ? favorites.filter(item => item !== name)
    : [...favorites, name];
  localStorage.setItem("gamesHubFavorites", JSON.stringify(favorites));
  renderGames();
}

function openGame(game) {
  document.getElementById("gameTitle").textContent = game.name;
  document.getElementById("gameFrame").src = game.path;
  document.getElementById("player").style.display = "block";
}

function closeGame() {
  document.getElementById("gameFrame").src = "about:blank";
  document.getElementById("player").style.display = "none";
}

document.getElementById("close").addEventListener("click", closeGame);
document.getElementById("fullscreen").addEventListener("click", () => {
  const frame = document.getElementById("gameFrame");
  if (frame.requestFullscreen) frame.requestFullscreen();
});

document.getElementById("favoritesButton").addEventListener("click", () => {
  favoritesOnly = !favoritesOnly;
  document.getElementById("favoritesButton").textContent =
    favoritesOnly ? "⭐ Show All" : "⭐ Favorites";
  renderGames();
});

document.querySelectorAll("#categories button").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelector("#categories .active")?.classList.remove("active");
    button.classList.add("active");
    selectedCategory = button.dataset.category;
    renderGames();
  });
});

search.addEventListener("input", renderGames);
renderGames();
</script>
</body>
</html>
