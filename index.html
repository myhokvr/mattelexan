<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAGMA GAMES</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:white;font-family:Arial,sans-serif}
header{background:#191a20;padding:18px;display:flex;gap:16px;
align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:900;color:#ff5b35}
input{padding:13px;border:1px solid #383943;border-radius:12px;
background:#24252d;color:white;flex:1;min-width:150px}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;
background:#30313b;color:white;font-weight:bold}
button:hover{background:#ff5838}
nav{display:flex;gap:9px;padding:15px;flex-wrap:wrap}
main{padding:15px}
h2{margin-top:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:15px}
.game{background:#202129;border-radius:15px;overflow:hidden;cursor:pointer;
border:1px solid #30313b;transition:.2s}
.game:hover{transform:translateY(-4px);border-color:#ff5838}
.cover{height:125px;display:grid;place-items:center;font-size:50px;
background:linear-gradient(135deg,#34313d,#652d32)}
.info{padding:12px}
.info small{color:#aaa}
#player{display:none;margin:15px;padding:15px;background:#202129;border-radius:15px}
#screen{height:330px;background:#101115;border-radius:10px;overflow:hidden;
position:relative;display:grid;place-items:center;text-align:center}
#race{display:none;width:100%;height:100%;background:linear-gradient(#24293c,#171820)}
#road{position:absolute;left:25%;width:50%;height:150%;top:-20%;
background:#444;clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)}
.car{position:absolute;bottom:30px;left:46%;font-size:38px;z-index:2}
#virus{display:none;position:fixed;inset:0;background:#080000;
z-index:20;color:#ff2929;font-family:monospace;padding:20px;overflow:auto}
.err{border:1px solid #ff2929;padding:10px;margin:8px 0;
background:#250000;animation:flicker .5s infinite alternate}
@keyframes flicker{to{background:#500000;color:#fff}}
#virus h1{font-size:clamp(28px,7vw,60px)}
#virus button{background:#ff2929;color:black}
footer{padding:25px;color:#888;text-align:center}
</style>
</head>
<body>
<header>
  <div class="logo">🔥 MAGMA</div>
  <input id="search" placeholder="🔍 Найти игру..." oninput="render()">
  <button onclick="showFavorites()">♥ Избранное</button>
  <button onclick="toggleVirus()">☣ СИМУЛЯЦИЯ</button>
</header>

<nav>
  <button onclick="setCategory('Все')">Все игры</button>
  <button onclick="setCategory('3D')">3D</button>
  <button onclick="setCategory('Гонки')">Гонки</button>
  <button onclick="setCategory('Аркады')">Аркады</button>
  <button onclick="setCategory('Избранное')">♥ Избранное</button>
</nav>

<main>
  <h2 id="heading">🔥 Популярные игры</h2>
  <div class="grid" id="games"></div>

  <section id="player">
    <button onclick="closeGame()">← Назад</button>
    <h2 id="gameTitle">Игра</h2>
    <div id="screen">
      <div id="race">
        <div id="road"></div>
        <div class="car">🏎️</div>
      </div>
      <div id="gameMessage">Выбери игру</div>
    </div>
    <p id="gameDescription"></p>
  </section>
</main>

<div id="virus">
  <h1>⚠ SYSTEM FAILURE</h1>
  <h2>DEN HÄR DATORN ÄR REDAN HACKAD</h2>
  <p>MAGMA SECURITY SIMULATION // FAKE ALERTS</p>
  <div id="errors"></div>
  <button onclick="toggleVirus()">ЗАКРЫТЬ СИМУЛЯЦИЮ</button>
  <p>Это постановочный эффект на странице. Система не заражена.</p>
</div>

<footer>MAGMA GAMES © 2026 · Играй и исследуй</footer>

<script>
const games=[
 {name:"3D Street Racer",cat:"Гонки",icon:"🏎️",own:true},
 {name:"Bloxd.io",cat:"3D",icon:"🧱",url:"https://bloxd.io/"},
 {name:"Minecraft Classic",cat:"3D",icon:"⛏️",url:"https://classic.minecraft.net/"},
 {name:"2048",cat:"Аркады",icon:"🔢",url:"https://play2048.co/"},{name:"Geometry Dash",cat:"Аркады",icon:"🟪",url:"https://www.robtopgames.com/"},
 {name:"Paper.io",cat:"Аркады",icon:"🟦",url:"https://paper-io.com/"},
 {name:"Slope",cat:"Гонки",icon:"🔴",url:"https://slopegame.com/"},
 {name:"Space Adventure",cat:"3D",icon:"🚀",own:true}
];
let category="Все",favorites=JSON.parse(localStorage.getItem("magmaFav")||"[]");
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=games.filter(g=>(category==="Все"g.cat===category
 (category==="Избранное"&&favorites.includes(g.name)))&&g.name.toLowerCase().includes(q));
 document.getElementById("heading").textContent=category==="Все"?"🔥 Популярные игры":category;
 document.getElementById("games").innerHTML=list.map(g=>
 <article class="game">
  <div onclick="openGame('${g.name}')" class="cover">${g.icon}</div>
  <div class="info">
   <b onclick="openGame('${g.name}')">${g.name}</b><br>
   <small>${g.cat}</small><br><br>
   <button onclick="openGame('${g.name}')">Играть ▶</button>
   <button onclick="favorite('${g.name}')">${favorites.includes(g.name)?"♥":"♡"}</button>
  </div>
 </article>).join("")||"<p>Игры не найдены.</p>";
}
function setCategory(c){category=c;render()}
function showFavorites(){setCategory("Избранное")}
function favorite(n){
 favorites=favorites.includes(n)?favorites.filter(x=>x!==n):[...favorites,n];
 localStorage.setItem("magmaFav",JSON.stringify(favorites));render();
}
function openGame(name){
 const g=games.find(x=>x.name===name);
 const p=document.getElementById("player");
 p.style.display="block";
 document.getElementById("gameTitle").textContent=name;
 document.getElementById("race").style.display="none";
 document.getElementById("gameMessage").style.display="block";
 document.getElementById("gameDescription").textContent="";
 if(g.own){
   document.getElementById("gameMessage").style.display="none";
   document.getElementById("race").style.display="block";
   document.getElementById("gameDescription").textContent=
   "Твоя мини-гонка! Нажимай ← и → на клавиатуре, чтобы двигаться.";
 }else{
   document.getElementById("gameMessage").innerHTML=
   "🌐 Настоящая игра<br><br><button onclick=\"launch('${g.url}')\">Открыть игру ↗</button>";
   document.getElementById("gameDescription").textContent=
   "Игра откроется на официальном сайте. Встраивание зависит от настроек сайта.";
 }
 p.scrollIntoView({behavior:"smooth"});
}
function launch(url){window.open(url,"_blank","noopener,noreferrer")}
function closeGame(){document.getElementById("player").style.display="none"}
document.addEventListener("keydown",e=>{
 if(!["ArrowLeft","ArrowRight"].includes(e.key))return;
 const car=document.querySelector(".car");
 if(document.getElementById("race").style.display==="block"){
  let x=parseFloat(car.style.left)||46;
  car.style.left=Math.max(5,Math.min(88,x+(e.key==="ArrowLeft"?-4:4)))+"%";
 }
});
let virusTimer;
function toggleVirus(){
 const v=document.getElementById("virus");
 if(v.style.display==="block"){
  v.style.display="none";clearInterval(virusTimer);return;
 }
 v.style.display="block";
 const messages=[
 "ERROR 0x80070005: ACCESS DENIED",
 "WARNING: FAKE SYSTEM ALERT",
 "CRITICAL ERROR: SIMULATION ACTIVE",
 "NETWORK STATUS: DEMO ONLY",
 "SECURITY SCAN: NO REAL CHANGES",
 "MEMORY ALERT: VISUAL EFFECT"
 ];
 const box=document.getElementById("errors");box.innerHTML="";
 let count=0;
 function addError(){
  const el=document.createElement("div");el.className="err";
  el.textContent=messages[count%messages.length];
  box.prepend(el);count++;
  while(box.children.length>12)box.lastChild.remove();
 }
 addError();virusTimer=setInterval(addError,700);
 setTimeout(()=>{clearInterval(virusTimer);v.style.display="none"},15000);
}
render();
</script>
</body>
</html>
