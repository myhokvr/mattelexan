<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>matteläxan27</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#20232a}
header{background:#171923;color:white;padding:22px;font-size:24px;font-weight:bold}
main{padding:45px 25px}
main p{color:#626775}
.switch{position:absolute;right:20px;top:22px;display:flex;align-items:center;gap:10px;color:white;font-size:13px}
.switch input{width:42px;height:23px;accent-color:#1684f8}
#errors{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.error{position:absolute;width:min(310px,90vw);background:#eee;color:#222;border:1px solid #888;box-shadow:0 5px 22px #0007;font-size:14px}
.error-title{background:#0755a5;color:white;padding:10px}
.error p{padding:10px}
.error button{display:block;margin:0 12px 12px auto;padding:5px 20px;pointer-events:auto}
#bsod{display:none;position:fixed;inset:0;overflow:auto;background:#0078d7;color:white;padding:9vh 10vw;font-family:"Segoe UI",Arial,sans-serif}
#bsod .sad{font-size:100px;margin-bottom:25px}
#bsod h2{font-size:28px;font-weight:400;line-height:1.4;max-width:700px}
#bsod p{font-size:18px;line-height:1.6}
@media(max-width:550px){header{padding:65px 18px 18px}.switch{left:18px;right:auto;top:18px}main{padding:30px 20px}#bsod{padding:8vh 7vw}#bsod .sad{font-size:75px}}
</style>
</head>
<body>
<header>matteläxan27</header>

<div class="switch">
  <label for="solve">Lösa din matteläxa</label>
  <input id="solve" type="checkbox">
</div>

<main id="home">
  <h1>Matteläxan</h1>
  <p>Behöver du hjälp med din matteläxa?</p>
  <p>Tryck på reglaget uppe i hörnet för att börja.</p>
</main>

<div id="errors"></div>

<div id="bsod">
  <div class="sad">:(</div>
  <h2>Your device ran into a problem and needs to restart.</h2>
  <p>We're just collecting some error info, and then we'll restart for you.</p>
  <p id="percent">0% complete</p>
  <p style="margin-top:45px;font-size:14px">
    STOP CODE: CRITICAL_PROCESS_DIED
  </p>
</div>

<script>
const solve=document.getElementById('solve');
const errors=document.getElementById('errors');
const home=document.getElementById('home');
const bsod=document.getElementById('bsod');
const percent=document.getElementById('percent');

const messages=[
'Calculation service stopped working.',
'Critical error in math_engine.exe',
'Unable to solve equation.',
'System warning: memory access violation',
'Unexpected exception detected.',
'Windows cannot complete this operation.',
'CRITICAL_PROCESS_DIED',
'Fatal system error.',
'Error 0x80004005: Operation failed.',
'System resource unavailable.'
];

let runId=0;

solve.addEventListener('change',()=>{
 if(!solve.checked)return;
 const id=++runId;
 solve.disabled=true;
 let count=0;

 function spawn(){
  if(id!==runId)return;

  if(count>=28){
   setTimeout(()=>{
    if(id!==runId)return;
    errors.replaceChildren();
    home.style.display='none';
    bsod.style.display='block';
    let p=0;
    percent.textContent='0% complete';

    const progress=setInterval(()=>{
     if(id!==runId){clearInterval(progress);return}
     p=Math.min(100,p+5);
     percent.textContent=p+'% complete';
     if(p>=100){
      clearInterval(progress);
      setTimeout(()=>{
       if(id!==runId)return;
       bsod.style.display='none';
       home.style.display='block';
       solve.checked=false;
       solve.disabled=false;
      },1500);
     }
    },350);
   },700);
   return;
  }

  const box=document.createElement('div');
  box.className='error';
  box.style.left=Math.random()*Math.max(1,innerWidth-320)+'px';
  box.style.top=Math.random()*Math.max(1,innerHeight-150)+'px';

  const title=document.createElement('div');
  title.className='error-title';
  title.textContent='System Error';

  const msg=document.createElement('p');
  msg.textContent=messages[count%messages.length];

  const btn=document.createElement('button');
  btn.textContent='OK';
  btn.onclick=()=>box.remove();box.append(title,msg,btn);
  errors.appendChild(box);
  count++;
  setTimeout(spawn,180);
 }
 spawn();
});
</script>
</body>
</html>
